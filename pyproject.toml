[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-dosing"
version = "0.2.0"
description = "DQN dose optimization on a simulated two-compartment PK / indirect-response model (Drug X)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Wen Rui Tan" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "torch>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
